<div
  class="border border-dashed border-2 border-green-300 px-3 py-2 text-center left-0 right-0ruc justify-center items-center text-center font-monof gap-7 width-100% flex flex-row flex-wrap"
>
  <div
    class="w-1/2 rounded-lg border p-5 shadow text-center font-mono flex flex-row flex-wrap justify-center items-center text-center font-mono"
  >
    <!-- <h1>Welcome To Parent Component</h1>
    <h2 class="text-3xl font-bold">Parent Component</h2>
    <p>Quantity: {{ quantity() }}</p> -->
    <div class="flex flex-col justify-center items-center text-center font-mono">
      <h1>Welcome To Parent Component</h1>
      <h2 class="text-3xl font-bold">Parent Component</h2>
      <p>Quantity_Parent: {{ quantity_parent() }}</p>
      <p>Username: {{ userName_parent }}</p>
      <button class="bg-green-50 rounded-2xl px-2 py-2 m-3" (click)="resetChildMsg()">
        resetChildMsg
      </button>
      <button class="bg-green-50 rounded-2xl px-2 py-2 m-3" (click)="showChildMsg()">
        showChildMsg
      </button>
    </div>
  </div>
  <div
    class="w-1/2 rounded-lg border p-5 shadow text-center flex flex-col flex-wrap justify-center items-center text-center font-mono"
  >
    <app-child
      [username]="userName_parent"
      (saved)="onChildDataSaved_parent($event)"
      [(quantity)]="quantity_parent"
    ></app-child>
  </div>
</div>
